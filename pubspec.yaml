name: campus_navigator
description: Indoor BLE beacon navigation app for LAU Beirut Campus - Nicol Hall
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  flutter_blue_plus: ^1.32.12
  provider: ^6.1.2
  http: ^1.2.0
  google_fonts: ^6.2.1
  permission_handler: ^11.3.0
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  geolocator: ^11.0.0
  location: 5.0.3
  share_plus: ^7.2.2
  flutter_tts: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "pin"
  ios: true
  image_path: "assets/images/pin.png"
  image_path_android: "assets/images/pin.png"
  image_path_ios: "assets/images/pin.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/pin.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
